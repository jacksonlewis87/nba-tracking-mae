[tool.poetry]
name = "nba-tracking-mae"
version = "0.1.0"
description = ""
authors = ["Jackson Lewis"]
readme = "README.md"
packages = [{include = "nba_tracking_mae"}]

[tool.pytest.ini_options]
pythonpath = ["src"]
testspath = ["tests"]
addopts = "-p no:cacheprovider"

[tool.poetry.dependencies]
python = "^3.10"
pytorch-lightning = "~2.0.4"
tensorboard = "~2.16.2"
tensorboardx = "~2.6.2"
torch = "~2.0.1"
pytorch_model_commons = { git = "https://github.com/jacksonlewis87/pytorch-model-commons.git", branch = "main" }

matplotlib = "^3.9.0"
[tool.poetry.group.dev.dependencies]
pytest = "~7.3.0"
pre-commit = "^3.7.1"
black = "^24.4.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
